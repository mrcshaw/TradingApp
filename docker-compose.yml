version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tradingapp-postgres
    environment:
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
      POSTGRES_DB: trading_app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tradingapp-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backtest-engine:
    build: 
      context: ./backtest-service
    container_name: tradingapp-backtest-engine
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./trading-app-client
    container_name: tradingapp-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./trading-app-client/src:/app/src
      - ./trading-app-client/public:/app/public
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    restart: unless-stopped

volumes:
  postgres_data:
