spring.application.name=chatbot-service
server.port=8082

# Spring AI / Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma:7b
spring.ai.ollama.chat.options.temperature=0.0

# Logging
logging.file.name=logs/chatbot-service.log
logging.level.org.springframework.ai=DEBUG